name: Publish Draft

# Seconde moitié de `publish` : valide `publish_draft.json`, puis insère les
# entrées que le site affiche.
#
# La validation passe d'abord en `--dry-run` : un brouillon incomplet ou dont
# la citation a été retouchée s'arrête ici, sans rien insérer.
#
# Deux façons d'arriver ici :
#   - automatique, à la suite de Draft Publication quand celle-ci a elle-même
#     été déclenchée par Nightly Ingestion (donc jamais après un passage
#     manuel de Draft Publication) : la chaîne ingestion -> brouillon ->
#     publication tourne alors sans intervention, `theme` n'étant relu par
#     personne — seule la détection automatique en répond ;
#   - manuelle, via *Run workflow*, pour publier un brouillon relu à la main
#     ou rejouer une publication après correction.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Draft Publication"]
    types: [completed]
    branches: [main]

# Même groupe que l'ingestion : publier pendant que `db-sync` écrit relirait
# les candidates à mi-chemin.
concurrency:
  group: ingestion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    # Manuel : toujours. Automatique : seulement si Draft Publication a réussi
    # ET a elle-même été déclenchée par Nightly Ingestion (`event ==
    # 'workflow_run'`) — un passage manuel de Draft Publication (test avec un
    # `limit`/`min_score` différent, par exemple) ne doit pas publier tout
    # seul ce qu'il vient de générer.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_POOLER_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_REGION: eu-west-2
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Déclenché automatiquement même quand Draft Publication n'a rien
      # commité (aucune candidate ce jour-là) : sans ce filtre, `publish
      # --apply` échouerait sur un fichier absent au lieu de sauter proprement.
      - name: Vérifier qu'il y a un brouillon
        id: check
        run: |
          if [ -f publish_draft.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Aucun brouillon à publier"
              echo ""
              echo "Draft Publication n'a rien commité — rien à faire ici."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Valider le brouillon
        if: steps.check.outputs.present == 'true'
        run: |
          set +e
          python -m politiscope.cli publish --apply --dry-run \
            2>&1 | tee "$RUNNER_TEMP/validation.txt"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            {
              echo "### Brouillon refusé — rien n'a été publié"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/validation.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publier
        if: steps.check.outputs.present == 'true'
        run: |
          # `| tee` renverrait le code de tee : sans pipefail, un échec
          # d'insertion passerait pour un succès et le brouillon serait retiré.
          set -o pipefail
          python -m politiscope.cli publish --apply | tee "$RUNNER_TEMP/publication.txt"
          {
            echo "### Publié"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/publication.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retirer le brouillon appliqué
        if: steps.check.outputs.present == 'true'
        # Un brouillon qui resterait sur `main` inviterait à le rejouer. La
        # base refuserait l'insertion — `validate` écarte toute citation déjà
        # publiée — mais autant ne pas proposer le geste.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --quiet --ignore-unmatch publish_draft.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Retire le brouillon publié"
          git push
