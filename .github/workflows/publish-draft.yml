name: Draft Publication

# First half of `publish`, run here rather than locally: the Supabase
# credentials already live in the repo's secrets, so nobody needs to copy
# them onto their machine to prepare a publication.
#
# The draft is committed to `main`. It only contains public tweets and their
# URL: committing it exposes nothing.
#
# Also triggers after Nightly Ingestion: a fresh draft is built every
# morning, with nothing to type. Publish Draft then picks it up on its own —
# see that workflow — so the nightly chain runs end to end without a human
# reading `theme`. A manual run here (*Run workflow*) behaves differently: it
# does NOT auto-publish, so it stays the tool for reviewing a draft by hand
# before committing to `main` yourself, or for testing different `limit` /
# `since_hours` / `min_score` values.
#
# That automatic trigger carries no `force` — the guard below therefore
# stays active, so it never overwrites a draft that's already being
# reviewed by hand.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of entries"
        default: "10"
      since_hours:
        description: "Rolling window (hours)"
        default: "24"
      min_score:
        description: "Minimum score"
        default: "60"
      force:
        description: "Overwrite an already-filled draft"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Nightly Ingestion"]
    types: [completed]
    branches: [main]

# Same group as ingestion: a draft built while `db-sync` is writing would
# read an intermediate state.
concurrency:
  group: ingestion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft:
    # Manual: always. Automatic: only if the ingestion that triggered this
    # run finished successfully — a failed ingestion probably didn't push
    # anything new to the database.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_POOLER_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_REGION: eu-west-2
      PYTHONIOENCODING: utf-8

    steps:
      # Full history, not the shallow default: the guard below reads
      # `git log` on publish_draft.json, and a single-commit clone would only
      # see the last author if that exact commit touched the file.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Regenerating wipes out any review in progress. The signal isn't
      # "the last commit isn't the bot's" (an unrelated commit — a schema
      # migration, say — used to trigger this wrongly). The reliable signal:
      # has `theme` changed since this workflow's last generation? If not,
      # nobody has reviewed anything, no matter who committed in between —
      # safe to regenerate.
      - name: Refuse to overwrite a filled draft
        # `inputs.*` only exists for workflow_dispatch; `github.event.inputs.*`
        # also works for the automatic trigger via workflow_run, where it's
        # simply absent — so never 'true', so never forced.
        if: ${{ github.event.inputs.force != 'true' }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys

          chemin = pathlib.Path("publish_draft.json")
          if not chemin.exists():
              sys.exit(0)

          BOT_EMAIL = "41898282+github-actions[bot]@users.noreply.github.com"

          def champs(entrees):
              # Only `theme` counts as "reviewed": the rest (score, citation,
              # source...) is never edited by hand.
              return {e.get("candidate_id"): e.get("theme") for e in entrees}

          # Filtered here, not via --author/--grep: "[bot]" in the address is
          # a valid regular expression (character class) for git, not the
          # literal text being searched for -- the filter never matched.
          historique = subprocess.run(
              ["git", "log", "--format=%H%x00%ae%x00%s", "--", str(chemin)],
              capture_output=True, text=True, check=True,
          ).stdout
          genere = ""
          for ligne in historique.splitlines():
              h, ae, s = ligne.split("\x00", 2)
              if ae == BOT_EMAIL and s == "Draft publication":
                  genere = h
                  break

          actuel = json.loads(chemin.read_text(encoding="utf-8")).get("entries", [])

          if genere:
              avant_brut = subprocess.run(
                  ["git", "show", f"{genere}:{chemin}"],
                  capture_output=True, text=True, check=True,
              ).stdout
              avant = json.loads(avant_brut).get("entries", [])
              inchange = champs(actuel) == champs(avant)
          else:
              # No generation found in the history: unexpected case, don't
              # take the risk -- same as before this more precise guard
              # existed.
              inchange = False

          if inchange:
              sys.exit(0)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### A hand-reviewed draft is already waiting on `main`\n\n")
              f.write(f"{len(actuel)} entry/entries; theme has changed since "
                      "the last generation -- a review is in progress. "
                      "Regenerating would erase that work.\n\n")
              f.write("Run *Publish Draft*, or re-run this one with `force` "
                      "checked to start over.\n")
          sys.exit(1)
          PY

      - name: Build the draft
        # Entries go through the environment rather than direct
        # interpolation: nothing from the form reaches the shell. The
        # `|| '...'` fallbacks repeat the defaults declared above: absent
        # from the automatic trigger, they only exist there.
        env:
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          SINCE_HOURS: ${{ github.event.inputs.since_hours || '24' }}
          MIN_SCORE: ${{ github.event.inputs.min_score || '60' }}
        run: |
          # An already-committed draft would be mistaken for the new one:
          # `publish` writes nothing when it finds no candidate.
          rm -f publish_draft.json
          python -m politiscope.cli publish \
            --limit "$LIMIT" \
            --min-score "$MIN_SCORE" \
            --since-hours "$SINCE_HOURS"

      - name: Commit the draft
        env:
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          SINCE_HOURS: ${{ github.event.inputs.since_hours || '24' }}
          MIN_SCORE: ${{ github.event.inputs.min_score || '60' }}
        run: |
          if [ ! -f publish_draft.json ]; then
            {
              echo "### No publishable candidate"
              echo ""
              echo "Criteria: limit $LIMIT · since-hours $SINCE_HOURS · min-score $MIN_SCORE"
              echo ""
              echo "Nothing was committed. Widen the window or lower the score."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish_draft.json

          if git diff --cached --quiet; then
            {
              echo "### Draft unchanged"
              echo ""
              echo "The draft already on \`main\` matches the same candidates."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "Draft publication"
          git push

          n=$(python -c "import json;print(len(json.load(open('publish_draft.json',encoding='utf-8'))['entries']))")
          {
            echo "### Draft committed"
            echo ""
            echo "$n entry/entries to review."
            echo ""
            echo "Check \`theme\` in \`publish_draft.json\`,"
            echo "commit, then run *Publish Draft*."
          } >> "$GITHUB_STEP_SUMMARY"
