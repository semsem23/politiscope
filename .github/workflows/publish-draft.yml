name: Draft Publication

# Première moitié de `publish`, exécutée ici plutôt qu'en local : les
# identifiants Supabase vivent déjà dans les secrets du dépôt, personne n'a
# besoin de les recopier sur sa machine pour préparer une publication.
#
# Le brouillon est commité sur `main` pour être relu et rempli directement sur
# github.com. Il ne contient que des tweets publics et leur URL : le commiter
# n'expose rien.
#
# Se déclenche aussi à la suite de Nightly Ingestion : un brouillon frais est
# proposé chaque matin, sans commande à taper. Ce déclenchement automatique
# n'a pas de `force` — le garde-fou ci-dessous reste donc actif, pour ne
# jamais écraser un brouillon déjà en cours de relecture.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre maximum d'entrées"
        default: "10"
      since_hours:
        description: "Fenêtre glissante (heures)"
        default: "48"
      min_score:
        description: "Score minimal"
        default: "75"
      force:
        description: "Écraser un brouillon déjà rempli"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Nightly Ingestion"]
    types: [completed]
    branches: [main]

# Même groupe que l'ingestion : un brouillon construit pendant que `db-sync`
# écrit lirait un état intermédiaire.
concurrency:
  group: ingestion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft:
    # Manuel : toujours. Automatique : seulement si l'ingestion qui a
    # déclenché ce passage s'est terminée avec succès — une ingestion en
    # échec n'a probablement rien versé de nouveau en base.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_POOLER_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_REGION: eu-west-2
      # Suggère `sujet` (un ou deux mots) sur chaque entrée du brouillon.
      # Facultatif : absent, le brouillon se construit quand même -- `sujet`
      # reste alors vide comme avant, à remplir à la main.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      # Historique complet, pas le défaut peu profond : le garde-fou plus bas
      # lit `git log` sur publish_draft.json, et un clone à un seul commit ne
      # verrait le dernier auteur que si ce commit précis touchait le fichier.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Régénérer efface le travail de relecture en cours. Se fier à « sujet
      # est rempli » ne suffit plus depuis que Claude Haiku le pré-remplit à la
      # génération -- avant toute relecture humaine. Le signal fiable est
      # l'auteur du dernier commit sur le fichier : le bot lui-même veut dire
      # que personne n'y a touché depuis ; quelqu'un d'autre veut dire qu'une
      # relecture est en cours, même à peine commencée.
      - name: Refuser d'écraser un brouillon rempli
        # `inputs.*` n'existe que pour workflow_dispatch ; `github.event.inputs.*`
        # fonctionne aussi pour le déclenchement automatique via workflow_run,
        # où il est simplement absent — donc jamais 'true', donc jamais forcé.
        if: ${{ github.event.inputs.force != 'true' }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys

          chemin = pathlib.Path("publish_draft.json")
          if not chemin.exists():
              sys.exit(0)

          BOT_EMAIL = "41898282+github-actions[bot]@users.noreply.github.com"
          auteur = subprocess.run(
              ["git", "log", "-1", "--format=%ae", "--", str(chemin)],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          if auteur == BOT_EMAIL:
              sys.exit(0)

          entrees = json.loads(chemin.read_text(encoding="utf-8")).get("entries", [])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Un brouillon relu à la main attend déjà sur `main`\n\n")
              f.write(f"Dernière modification par {auteur or 'un humain'}, pas par "
                      f"le workflow : {len(entrees)} entrée(s), une relecture est "
                      "peut-être en cours. Les régénérer effacerait ce travail.\n\n")
              f.write("Lancez *Publish Draft*, ou relancez celui-ci en cochant "
                      "`force` pour repartir de zéro.\n")
          sys.exit(1)
          PY

      - name: Construire le brouillon
        # Les entrées passent par l'environnement plutôt que par interpolation
        # directe : rien de ce qui vient du formulaire n'atteint le shell.
        # Les `|| '...'` reprennent les défauts déclarés ci-dessus : absents du
        # déclenchement automatique, ils n'existent alors que là.
        env:
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          SINCE_HOURS: ${{ github.event.inputs.since_hours || '48' }}
          MIN_SCORE: ${{ github.event.inputs.min_score || '75' }}
        run: |
          # Un brouillon déjà commité serait pris pour le nouveau : `publish`
          # n'écrit rien quand il ne trouve aucune candidate.
          rm -f publish_draft.json
          python -m politiscope.cli publish \
            --limit "$LIMIT" \
            --min-score "$MIN_SCORE" \
            --since-hours "$SINCE_HOURS"

      - name: Commiter le brouillon
        env:
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          SINCE_HOURS: ${{ github.event.inputs.since_hours || '48' }}
          MIN_SCORE: ${{ github.event.inputs.min_score || '75' }}
        run: |
          if [ ! -f publish_draft.json ]; then
            {
              echo "### Aucune candidate publiable"
              echo ""
              echo "Critères : limit $LIMIT · since-hours $SINCE_HOURS · min-score $MIN_SCORE"
              echo ""
              echo "Rien n'a été commité. Élargissez la fenêtre ou abaissez le score."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish_draft.json

          if git diff --cached --quiet; then
            {
              echo "### Brouillon inchangé"
              echo ""
              echo "Le brouillon déjà sur \`main\` correspond aux mêmes candidates."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "Brouillon de publication"
          git push

          n=$(python -c "import json;print(len(json.load(open('publish_draft.json',encoding='utf-8'))['entries']))")
          {
            echo "### Brouillon commité"
            echo ""
            echo "$n entrée(s) à relire."
            echo ""
            echo "Remplissez \`sujet\` dans \`publish_draft.json\`,"
            echo "commitez, puis lancez *Publish Draft*."
          } >> "$GITHUB_STEP_SUMMARY"
